name: CI

# `test` runs the unit tests, the typecheck and the production build on every
# push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.txt || { grep -E "FAIL|Error|×|✗" test.txt | head -10 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - run: npm run typecheck
      - run: npm run build


  # The consultant dashboard (frontend/, TanStack Start + bun).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: bun run test
        run: |
          set -o pipefail
          bun run test 2>&1 | tee test.txt || { grep -E "FAIL|Error|×|✗" test.txt | head -10 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: bun run build
        run: |
          set -o pipefail
          bun run build 2>&1 | tee build.txt || { grep -iE "error" build.txt | head -10 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      # Vite builds without type-checking, so run tsc too. The dashboard's tsconfig is
      # stricter than the repo root's, and the shared ../src files predate it, so this
      # step only fails on errors in the dashboard's own integration files and src/call.
      - name: Typecheck the live-call integration
        run: |
          bunx tsc --noEmit -p . > tsc.txt 2>&1 || true
          grep -E "^(src/components/live-call|src/lib/alexa-settings|src/routes/interview\.|src/lib/initial-questions|src/routes/projects\.\\\$projectId\.(plan|sources)|src/routes/settings|src/routes/projects\.\\\$projectId\.live|src/components/research|src/lib/(types|store))|^\.\./src/(call|avatar)/" tsc.txt > mine.txt || true
          head -10 mine.txt | while IFS= read -r line; do echo "::error::$line"; done
          echo "$(wc -l < tsc.txt) tsc lines in total, $(wc -l < mine.txt) in integration files"
          test ! -s mine.txt
