name: CI

# `test` runs the unit tests, the typecheck and the production build on every
# push and pull request.
#
# `live` talks to the real Higgs Realtime API with your Boson API key
# repository secret, using the headless probe (tools/probe.ts) — no browser, no
# microphone. It runs when started by hand (Actions → CI → Run workflow) or on a
# push whose commit message contains "[live]", and it is skipped with a warning
# when no key secret is set.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  live:
    needs: test
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[live]')
    runs-on: ubuntu-latest
    env:
      SHORT_SCRIPT: "What's your name?"
      # Long enough (~35 s of speech) that the reply is still being generated
      # when the probe starts talking over it.
      LONG_SCRIPT: >-
        Before we begin, let me walk you through how today's session will work.
        First, I will ask you a few short questions about your background and
        what you hope to get out of this conversation. Then we will talk through
        your answers together, and I will share some suggestions along the way.
        Please feel free to stop me at any point if something is unclear, or if
        you would like me to repeat anything. There are no right or wrong
        answers here, so just speak naturally and take your time. When you are
        ready, we can start with the first question.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Uses BOSON_API_KEY if that secret exists, otherwise the first repository
      # secret whose name mentions BOSON or HIGGS. Only the secret's NAME is
      # ever printed.
      - name: Find the API key secret
        id: key
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          name=$(jq -r 'if has("BOSON_API_KEY") then "BOSON_API_KEY"
                        else ([keys[] | select(test("BOSON|HIGGS"; "i"))][0] // "") end' <<<"$ALL_SECRETS")
          if [ -z "$name" ]; then
            names=$(jq -r '[keys[] | select(. != "github_token")] | join(", ")' <<<"$ALL_SECRETS")
            echo "::warning::No Boson API key secret found (repository secrets visible to this job: ${names:-none}). Live test skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          value=$(jq -r --arg n "$name" '.[$n]' <<<"$ALL_SECRETS")
          echo "::add-mask::$value"
          echo "BOSON_API_KEY=$value" >> "$GITHUB_ENV"
          echo "::notice::Using the $name secret for the live test."
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Speak the script, then answer it by voice
        if: steps.key.outputs.present == 'true'
        run: npm run probe -- --script "$SHORT_SCRIPT" --say "My name is Olivia." --out captures/script-then-reply.json

      - name: Talk over the script while it is being spoken
        if: steps.key.outputs.present == 'true'
        run: npm run probe -- --script "$LONG_SCRIPT" --barge "Sorry, can I stop you there for a second?" --out captures/script-barge-in.json

      - name: Report
        if: always() && steps.key.outputs.present == 'true'
        run: |
          # One annotation per line of each conversation, so the result can be
          # read from the run page without opening the logs.
          report() {
            f="$1"; label="$2"
            [ -f "$f" ] || { echo "::warning title=$label::no capture written"; return; }
            jq -r '
              def clean: gsub("[\r\n]+"; " ");
              . as $all
              | ([.[] | select(.type == "response.created" and .response.metadata.source == "script") | .response.id][0] // "") as $sid
              | (reduce (.[] | select(.type == "response.output_item.added")) as $e ({}; .[$e.item.id] = $e.response_id)) as $owner
              | (reduce (.[] | select(.type == "response.done")) as $e ({}; .[$e.response.id] = $e.response.status)) as $status
              | .[]
              | if .type == "conversation.item.input_audio_transcription.completed" then
                  "user: " + (.transcript | clean)
                elif .type == "response.output_audio_transcript.done" then
                  ($owner[(.item_id // "")] // "") as $rid
                  | (if $rid == $sid then "higgs [SCRIPT, " else "higgs [" end)
                    + ($status[$rid] // "unknown") + "]: " + (.transcript | clean)
                elif .type == "input_audio_buffer.speech_started" then
                  "vad: speech_started"
                elif .type == "response.done" and .response.id == $sid then
                  "scripted response " + .response.status + ", streamed text: "
                    + ([$all[] | select(.type == "response.output_audio_transcript.delta"
                                        and $owner[(.item_id // "")] == $sid) | .delta] | join("") | clean)
                elif .type == "error" then
                  "ERROR: " + ((.error | tostring) | clean)
                else empty end
            ' "$f" | while IFS= read -r line; do echo "::notice title=$label::$line"; done
          }
          report captures/script-then-reply.json "script → reply"
          report captures/script-barge-in.json "script → barge-in"

      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: live-captures
          path: captures/
          if-no-files-found: ignore
