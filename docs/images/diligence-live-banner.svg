<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title description">
  <title id="title">Diligence Live — every thesis starts a conversation</title>
  <desc id="description">A midnight-blue illustration with mint, violet, cyan, coral and gold accents. A voice waveform connects thesis, plan, interview, evidence and the next research round.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset="1" stop-color="#17234A"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#8D79F7" stop-opacity="0.28"/><stop offset="1" stop-color="#8D79F7" stop-opacity="0"/></radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#75F5CF"/><stop offset="0.5" stop-color="#79C9FF"/><stop offset="1" stop-color="#C4AEFF"/></linearGradient>
  </defs>
  <rect width="1280" height="500" rx="26" fill="url(#background)"/>
  <circle cx="1080" cy="150" r="270" fill="url(#glow)"/>
  <circle cx="1220" cy="40" r="140" fill="none" stroke="#C4AEFF" stroke-opacity="0.12"/>
  <circle cx="1220" cy="40" r="175" fill="none" stroke="#C4AEFF" stroke-opacity="0.08"/>
  <path d="M 55 322 H 1225" fill="none" stroke="#A5B7DC" stroke-opacity="0.15" stroke-dasharray="3 9"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="56" y="40" width="228" height="30" rx="15" fill="#17363C" stroke="#75F5CF" stroke-opacity="0.3"/>
    <circle cx="73" cy="55" r="4" fill="#75F5CF"/>
    <text x="88" y="59" fill="#A2FFE4" font-size="11" font-weight="700" letter-spacing="1.3">BOSON HIGGS REALTIME</text>
    <text x="54" y="145" fill="#F7FAFF" font-size="66" font-weight="750" letter-spacing="-2">Diligence Live</text>
    <text x="58" y="192" fill="#D4C7FF" font-size="29" font-weight="600">Every thesis starts a conversation.</text>
    <text x="58" y="238" fill="#C0CEE5" font-size="19">Ask better questions. Follow the evidence.</text>
    <text x="58" y="266" fill="#C0CEE5" font-size="19">Build the next round around what you learn.</text>
    <text x="58" y="302" fill="#9CAFD0" font-size="11" font-weight="600" letter-spacing="1.4">PRIVATE EQUITY  ·  COMMERCIAL DUE DILIGENCE  ·  PRIMARY RESEARCH</text>
    <rect x="922" y="66" width="286" height="210" rx="20" fill="#1C2A4D" stroke="#6C79AB" stroke-opacity="0.65"/>
    <path d="M 953 276 L 953 294 L 976 276" fill="#1C2A4D" stroke="#6C79AB" stroke-opacity="0.65"/>
    <text x="946" y="100" fill="#89F9D6" font-size="11" font-weight="700" letter-spacing="1.5">THE NEXT QUESTION</text>
    <text x="946" y="139" fill="#F7FAFF" font-size="26" font-weight="600">What changed</text>
    <text x="946" y="172" fill="#F7FAFF" font-size="26" font-weight="600">your mind?</text>
    <g stroke="url(#wave)" stroke-width="5" stroke-linecap="round"><path d="M 948 222 V 226 M 960 214 V 234 M 972 203 V 245 M 984 211 V 237 M 996 192 V 256 M 1008 204 V 244 M 1020 214 V 234 M 1032 198 V 250 M 1044 186 V 262 M 1056 201 V 247 M 1068 211 V 237 M 1080 195 V 253 M 1092 207 V 241 M 1104 217 V 231 M 1116 205 V 243 M 1128 212 V 236 M 1140 201 V 247 M 1152 211 V 237 M 1164 218 V 230 M 1176 222 V 226"/></g>
    <rect x="1000" y="293" width="208" height="47" rx="12" fill="#173C3D" stroke="#75F5CF" stroke-opacity="0.25"/>
    <circle cx="1025" cy="316" r="10" fill="#75F5CF"/>
    <path d="M 1020 316 L 1024 320 L 1031 312" fill="none" stroke="#0B1026" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1044" y="322" fill="#B7FFE9" font-size="14" font-weight="600">Follow the evidence</text>
    <rect x="56" y="365" width="220" height="86" rx="12" fill="#202B4E"/>
    <rect x="56" y="365" width="220" height="4" rx="2" fill="#C4AEFF"/>
    <text x="74" y="397" fill="#C4AEFF" font-size="12" font-weight="700" letter-spacing="1.4">01 / THESIS</text>
    <text x="74" y="429" fill="#EDF3FF" font-size="16">Start with a belief</text>
    <rect x="290" y="365" width="220" height="86" rx="12" fill="#202B4E"/>
    <rect x="290" y="365" width="220" height="4" rx="2" fill="#75F5CF"/>
    <text x="308" y="397" fill="#75F5CF" font-size="12" font-weight="700" letter-spacing="1.4">02 / PLAN</text>
    <text x="308" y="429" fill="#EDF3FF" font-size="16">Make it testable</text>
    <rect x="524" y="365" width="220" height="86" rx="12" fill="#202B4E"/>
    <rect x="524" y="365" width="220" height="4" rx="2" fill="#79C9FF"/>
    <text x="542" y="397" fill="#79C9FF" font-size="12" font-weight="700" letter-spacing="1.4">03 / INTERVIEW</text>
    <text x="542" y="429" fill="#EDF3FF" font-size="16">Follow the answer</text>
    <rect x="758" y="365" width="220" height="86" rx="12" fill="#202B4E"/>
    <rect x="758" y="365" width="220" height="4" rx="2" fill="#FF91A4"/>
    <text x="776" y="397" fill="#FF91A4" font-size="12" font-weight="700" letter-spacing="1.4">04 / EVIDENCE</text>
    <text x="776" y="429" fill="#EDF3FF" font-size="16">Check what holds up</text>
    <rect x="992" y="365" width="232" height="86" rx="12" fill="#202B4E"/>
    <rect x="992" y="365" width="232" height="4" rx="2" fill="#FFCF77"/>
    <text x="1010" y="397" fill="#FFCF77" font-size="12" font-weight="700" letter-spacing="1.4">05 / NEXT ROUND</text>
    <text x="1010" y="429" fill="#EDF3FF" font-size="16">Ask a sharper question</text>
    <text x="56" y="480" fill="#8FA3C7" font-size="11" letter-spacing="0.3">An AI research partner for conversations with customers and industry experts.</text>
  </g>
</svg>
